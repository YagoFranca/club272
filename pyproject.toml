[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "club272"
version = "4.0.0"
description = "Sistema integrado de reconhecimento facial e controle de presença do 272 Club"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "face-recognition>=1.3",
    "dlib>=19.24",
    "numpy>=1.23",
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
club272 = "club272.app:main"

[tool.setuptools.packages.find]
include = ["club272*"]

[tool.setuptools.package-data]
club272 = ["assets/*"]
